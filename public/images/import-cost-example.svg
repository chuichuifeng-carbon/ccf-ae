<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Стоимость импорта и валовая маржа</title><desc id="desc">Учебный пример: 250 + 85 + 110 = 445 USD. Продажа за 599 USD даёт валовую прибыль 154 USD и маржу 25,7%.</desc>
<rect width="1200" height="630" rx="28" fill="#f2f3f5"/>
<g font-family="Arial,sans-serif" fill="#111827">
<text x="70" y="82" font-size="40" font-weight="700">Стоимость импорта и валовая маржа</text>
<text x="70" y="126" font-size="23" fill="#475569">Учебный пример в USD, не предложение цены или расчёт налогов</text>
<g fill="#fff" stroke="#dce1e6"><rect x="70" y="180" width="330" height="155" rx="20"/><rect x="435" y="180" width="330" height="155" rx="20"/><rect x="800" y="180" width="330" height="155" rx="20"/></g>
<g text-anchor="middle" font-size="25" fill="#475569"><text x="235" y="225">Цена производителя</text><text x="600" y="225">Перевозка</text><text x="965" y="225">Прочие расходы</text></g>
<g text-anchor="middle" font-size="46" font-weight="700"><text x="235" y="293">250 USD</text><text x="600" y="293">85 USD</text><text x="965" y="293">110 USD</text></g>
<rect x="70" y="375" width="1060" height="180" rx="20" fill="#0070ee"/>
<g text-anchor="middle" font-size="25" fill="#fff"><text x="235" y="426">Полная стоимость</text><text x="600" y="426">Валовая прибыль</text><text x="965" y="426">Валовая маржа</text></g>
<g text-anchor="middle" font-size="46" fill="#fff" font-weight="700"><text x="235" y="499">445 USD</text><text x="600" y="499">154 USD</text><text x="965" y="499">25,7%</text></g>
<text x="70" y="599" font-size="23" fill="#475569">Цена перепродажи в примере: 599 USD · CCF</text>
</g></svg>
